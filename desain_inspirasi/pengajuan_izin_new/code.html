<!DOCTYPE html><html lang="id" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Green Attendance - Request Leave</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
            darkMode: "class",

                extend: {

                        "primary-container": "#00837b",

                        "outline": "#6d7a78",

                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#3e4948",
                        "surface-container": "#eeeeee",
                        "background": "#f9f9f9",
                        "on-secondary-fixed": "#00201e",
                        "inverse-surface": "#2f3131",
                        "surface-container-highest": "#e2e2e2",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#99f2e9",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#00504b",
                        "tertiary-container": "#6b7776",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#bcc9c7",
                        "tertiary-fixed-dim": "#bdc9c8",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dadada",
                        "on-background": "#1a1c1c",
                        "on-primary-fixed": "#00201e",
                        "on-surface": "#1a1c1c",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#f3fffe",
                        "on-primary-fixed-variant": "#00504b",
                        "tertiary": "#535e5e",
                        "inverse-on-surface": "#f1f1f1",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary-container": "#006f68",
                        "secondary-fixed-dim": "#7dd6cd",
                        "on-tertiary-fixed": "#131d1d",
                        "primary-fixed": "#8cf4ea",
                        "surface-container-low": "#f3f3f3",
                        "surface-bright": "#f9f9f9",
                        "surface-variant": "#e2e2e2",
                        "primary": "#006761",
                        "secondary": "#006a64",
                        "secondary-container": "#96efe6",
                        "surface-tint": "#006a64"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "margin-mobile": "20px",
                        "unit": "4px",
                        "stack-lg": "32px",
                        "stack-sm": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-time": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],

                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],

                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[style*="'FILL' 1"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-low dark:bg-background text-on-surface min-h-screen flex justify-center font-body-md pb-32">
<!-- Mobile Container -->
<div class="w-full max-w-md bg-surface-container-low min-h-screen relative flex flex-col shadow-xl">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile z-40 sticky top-0 backdrop-blur-sm py-5 bg-surface-container/90"><div class="flex items-center gap-2"><div class="flex flex-col"><h1 class="text-[18px] font-bold text-on-surface">Green Attendance</h1></div></div><div class="flex items-center gap-2"><button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors rounded-full bg-surface-container-lowest"><span class="material-symbols-outlined">notifications</span></button></div></header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile py-stack-md flex flex-col gap-stack-lg">
<!-- Page Title -->
<div class="flex flex-col gap-unit">
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">Pengajuan Izin</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Isi form di bawah ini untuk mengajukan izin ketidakhadiran.</p>
</div>
<!-- Form Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_8px_24px_rgba(0,0,0,0.05)] p-6 flex flex-col gap-stack-md">
<!-- Jenis Izin (Select) -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface">Jenis Izin</label>
<div class="relative">
<select class="w-full bg-[#F5F5F5] border-none rounded-lg py-3 px-4 text-body-md font-body-md text-on-surface appearance-none focus:ring-2 focus:ring-primary transition-all">
<option disabled="" selected="" value="">Pilih jenis izin...</option>
<option value="sakit">Sakit</option>
<option value="izin">Izin</option>
<option value="cuti">Cuti</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Date Inputs -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface">Tanggal Mulai</label>
<input class="w-full bg-[#F5F5F5] border-none rounded-lg py-3 px-4 text-body-md font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all" type="date">
</div>
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface">Tanggal Selesai</label>
<input class="w-full bg-[#F5F5F5] border-none rounded-lg py-3 px-4 text-body-md font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all" type="date">
</div>
</div>
<!-- File Upload -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface">Unggah Lampiran</label>
<label class="w-full border-2 border-dashed border-outline-variant rounded-xl p-6 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-surface-variant transition-colors bg-[#F5F5F5]">
<span class="material-symbols-outlined text-outline" data-icon="upload_file" style="font-size: 32px;">upload_file</span>
<span class="text-body-md font-body-md text-on-surface-variant text-center">Klik untuk mengunggah atau seret file ke sini<br><span class="text-xs text-outline">(Max 5MB: JPG, PNG, PDF)</span></span>
<input accept=".jpg,.jpeg,.png,.pdf" class="hidden" type="file">
</label>
</div>
<!-- Alasan (Textarea) -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface">Alasan</label>
<textarea class="w-full bg-[#F5F5F5] border-none rounded-lg py-3 px-4 text-body-md font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all resize-none h-32" placeholder="Tuliskan alasan pengajuan izin secara detail..."></textarea>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-secondary text-on-primary font-headline-md text-headline-md rounded-xl py-4 mt-4 shadow-[0px_8px_24px_rgba(0,0,0,0.05)] transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="send">send</span>
                    Kirim Pengajuan
                </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-48px)] max-w-[380px] z-50 flex justify-between items-center bg-surface-container-lowest py-3 px-6 rounded-full shadow-2xl border border-surface-variant">
  <!-- Beranda -->
  <button class="flex flex-col items-center justify-center text-outline min-w-[56px] hover:text-primary transition-colors">
    <span class="material-symbols-outlined mb-1">home</span>
    <span class="text-[11px]">Beranda</span>
  </button>
  <!-- Riwayat -->
  <button class="flex flex-col items-center justify-center text-outline min-w-[56px] hover:text-primary transition-colors">
    <span class="material-symbols-outlined mb-1">history</span>
    <span class="text-[11px]">Riwayat</span>
  </button>
  <!-- Center Absen Button (FAB) -->
  <div class="relative -mt-12">
    <button class="w-14 h-14 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg hover:scale-105 transition-transform">
      <span class="material-symbols-outlined text-[28px]">touch_app</span>
    </button>
  </div>
  <!-- Izin (Active) -->
  <button class="flex flex-col items-center justify-center text-primary min-w-[56px]">
    <span class="material-symbols-outlined filled mb-1" style="font-variation-settings: 'FILL' 1;">assignment_turned_in</span>
    <span class="text-[11px] font-semibold">Izin</span>
  </button>
  <!-- Profile -->
  <button class="flex flex-col items-center justify-center text-outline min-w-[56px] hover:text-primary transition-colors">
    <span class="material-symbols-outlined mb-1">person</span>
    <span class="text-[11px]">Profile</span>
  </button>
</nav>
</div>


</body></html>
