<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>EcoClock - Selfie Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#99f2e9",
                        "surface-bright": "#f9f9f9",
                        "surface-container-high": "#e8e8e8",
                        "outline": "#6d7a78",
                        "secondary": "#006a64",
                        "inverse-on-surface": "#f1f1f1",
                        "surface-container": "#eeeeee",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#f3fffe",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#8cf4ea",
                        "inverse-primary": "#6fd8ce",
                        "tertiary-container": "#6b7776",
                        "on-secondary-container": "#006f68",
                        "surface-dim": "#dadada",
                        "on-primary-container": "#f3fffc",
                        "primary": "#006761",
                        "surface-container-highest": "#e2e2e2",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#00504b",
                        "on-tertiary-fixed": "#131d1d",
                        "surface-variant": "#e2e2e2",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#3e4948",
                        "surface-container-low": "#f3f3f3",
                        "secondary-fixed-dim": "#7dd6cd",
                        "on-surface": "#1a1c1c",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#006a64",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#3d4947",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#6fd8ce",
                        "on-primary-fixed-variant": "#00504b",
                        "tertiary-fixed-dim": "#bdc9c8",
                        "on-secondary-fixed": "#00201e",
                        "surface": "#f9f9f9",
                        "inverse-surface": "#2f3131",
                        "primary-container": "#00837b",
                        "on-primary-fixed": "#00201e",
                        "outline-variant": "#bcc9c7",
                        "tertiary": "#535e5e",
                        "tertiary-fixed": "#d9e5e4",
                        "secondary-container": "#96efe6",
                        "on-background": "#1a1c1c",
                        "background": "#f9f9f9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "margin-mobile": "20px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-time": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-time": ["48px", { "lineHeight": "48px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Camera overlay pulsing animation */
        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(0, 103, 97, 0.7); }
            70% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 10px rgba(0, 103, 97, 0); }
            100% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(0, 103, 97, 0); }
        }
        
        .face-guide-pulse {
            animation: pulse-ring 2s infinite;
        }

        .camera-mask {
            mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, transparent 40%, black 60%);
            -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, transparent 40%, black 60%);
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex justify-center text-on-surface font-body-md overflow-x-hidden">
<!-- Mobile Container (Max Width 448px) -->
<div class="w-full max-w-md bg-surface-container-lowest min-h-screen relative flex flex-col shadow-sm">
<!-- Header -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full flex-shrink-0 z-10 bg-surface-container-lowest">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Absen Selfie</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative bg-surface-container-low overflow-hidden">
<!-- Camera Viewfinder -->
<div class="relative w-full flex-1 min-h-[400px] overflow-hidden">
<!-- Placeholder for actual camera feed -->
<img class="absolute inset-0 w-full h-full object-cover" data-alt="A professional close up portrait photograph of an employee looking directly at the camera, preparing to take a selfie for an attendance app. The lighting is soft and natural, emphasizing a bright, light-mode corporate aesthetic. The background is slightly out of focus, suggesting a modern office space with subtle white and light gray tones. The subject appears calm and focused." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDV9wzMf_E5NWL4zGWjSS1XPX-OLr71G88rue1D6iBWdsq0WogJU--Y_1en2oZTF8-4Wnpv4ZVXHAvuf3I35H4sDZ-XE1dtkacD8Nq_61zICdssHUHOp48Ezp5nkIo8XEouLxiMqapY4W_0p8obhe16tmv-UfMB0hZZxD7UZCv8v5mTeDYI7I8G4aGLjqwL9TYjg4niVVRThkGLcgFCOZ1nhV8nr4tSxoKvFW7MnFaxRIEDks9iUhI"/>
<!-- Dark Overlay with Clear Center -->
<div class="absolute inset-0 bg-black/40 camera-mask pointer-events-none"></div>
<!-- Face Guide Overlay (Dashed/Pulsing) -->
<div class="absolute top-1/2 left-1/2 w-64 h-80 border-2 border-primary rounded-full face-guide-pulse pointer-events-none border-dashed"></div>
<!-- Corner Brackets -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-[350px] pointer-events-none">
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
</div>
</div>
<!-- Instruction Text -->
<div class="bg-surface-container-lowest px-margin-mobile pt-stack-md pb-stack-lg flex-shrink-0 text-center rounded-t-xl -mt-4 relative z-10">
<div class="w-12 h-1 bg-surface-variant rounded-full mx-auto mb-stack-sm"></div>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg">Posisikan wajah Anda di dalam area lingkaran</p>
<!-- Capture Button -->
<button class="w-20 h-20 bg-primary rounded-full mx-auto flex items-center justify-center shadow-md active:scale-90 transition-transform mb-stack-md hover:bg-primary-container group relative">
<!-- Inner ring for camera button look -->
<div class="w-16 h-16 border-2 border-white rounded-full flex items-center justify-center group-hover:scale-95 transition-transform">
<span class="material-symbols-outlined text-white text-3xl" data-icon="photo_camera" data-weight="fill" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</button>
</div>
</main>
</div>
</body></html>
